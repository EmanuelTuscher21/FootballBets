<html lang="en" class="dark">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#0f172a'
                        },
                        darkbg: '#121620',
                        darkcard: '#1b202e',
                        darkborder: '#2a3142'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']

                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f131c;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .match-card {
            background-color: #1a202c;
            border: 1px solid #2d3748;
            transition: all 0.2s ease-in-out;
        }
        .match-card:hover {
            border-color: #4a5568;
            transform: translateY(-2px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1a202c;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }
        .glass-panel {
            background: rgba(26, 32, 44, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar">

    <header class="sticky top-0 z-50 glass-panel border-b border-gray-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-trophy text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        <span>UEFA Nations League</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">2026</span>
                    </h1>
                    <p id="sub-title" class="text-xs text-gray-400">Matchday Predictor & Live Results</p>
                </div>
            </div>

            <!-- Stats & Language Toggle -->
            <div class="flex items-center space-x-3 sm:space-x-4">
                <div class="bg-gray-800/80 rounded-xl px-3 py-1.5 border border-gray-700/60 flex items-center space-x-2">
                    <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                    <span class="text-xs text-gray-400" id="score-label">Points:</span>
                    <span id="user-points" class="font-extrabold text-blue-400 text-sm">0</span>
                </div>

                <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 border border-gray-700 text-xs font-semibold text-gray-200 transition flex items-center space-x-2">
                    <i class="fa-solid fa-globe text-blue-400"></i>
                    <span id="lang-indicator">DE</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- Banner & Quick Summary -->
        <div class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border border-blue-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-blue-300 font-medium uppercase tracking-wider" id="stat-matches-lbl">Total Matches</p>
                    <p class="text-2xl font-black text-white mt-0.5" id="total-matches-count">56</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">
                    <i class="fa-solid fa-futbol text-lg"></i>
                </div>
            </div>

            <div class="bg-gradient-to-r from-emerald-900/40 to-teal-900/40 border border-emerald-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-emerald-300 font-medium uppercase tracking-wider" id="stat-completed-lbl">Completed</p>
                    <p class="text-2xl font-black text-white mt-0.5" id="completed-matches-count">10</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-check-circle text-lg"></i>
                </div>
            </div>

            <div class="bg-gradient-to-r from-amber-900/40 to-orange-900/40 border border-amber-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-amber-300 font-medium uppercase tracking-wider" id="stat-bets-lbl">Active Predictions</p>
                    <p class="text-2xl font-black text-white mt-0.5" id="active-bets-count">0</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400">
                    <i class="fa-solid fa-bullseye text-lg"></i>
                </div>
            </div>

            <div class="bg-gradient-to-r from-purple-900/40 to-pink-900/40 border border-purple-500/30 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs text-purple-300 font-medium uppercase tracking-wider" id="stat-accuracy-lbl">Accuracy</p>
                    <p class="text-2xl font-black text-white mt-0.5" id="prediction-accuracy">0%</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400">
                    <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
            </div>
        </div>

        <!-- Filter & Navigation Tabs -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 mb-6">
            <div class="flex items-center space-x-1 bg-gray-900/80 p-1 rounded-2xl border border-gray-800 overflow-x-auto custom-scrollbar">
                <button onclick="setFilter('all')" id="tab-all" class="px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap bg-blue-600 text-white shadow">
                    <i class="fa-solid fa-list mr-1.5"></i><span id="txt-tab-all">All Fixtures</span>
                </button>
                <button onclick="setFilter('finished')" id="tab-finished" class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition whitespace-nowrap">
                    <i class="fa-solid fa-square-check mr-1.5 text-emerald-400"></i><span id="txt-tab-finished">Finished (Endstand)</span>
                </button>
                <button onclick="setFilter('upcoming')" id="tab-upcoming" class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition whitespace-nowrap">
                    <i class="fa-solid fa-clock mr-1.5 text-blue-400"></i><span id="txt-tab-upcoming">Upcoming (Termine)</span>
                </button>
            </div>

            <!-- Global Action Controls -->
            <div class="flex items-center space-x-2">
                <button onclick="lockAllBets()" class="px-3.5 py-2 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-200 text-xs font-semibold rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-lock"></i>
                    <span id="txt-lock-btn">Lock All Predictions</span>
                </button>
                <button onclick="resetPredictions()" class="px-3.5 py-2 bg-red-900/20 hover:bg-red-900/40 border border-red-700/40 text-red-300 text-xs font-semibold rounded-xl transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span id="txt-reset-btn">Reset</span>
                </button>
            </div>
        </div>

        <!-- Date / Group Filter Pills -->
        <div id="date-pills" class="flex items-center space-x-2 overflow-x-auto pb-3 mb-4 custom-scrollbar">
            <!-- Dynamically Populated -->
        </div>

        <div id="matches-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Dynamically Populated Cards -->
        </div>

    </main>

            { id: 43, dateKey: "1.10", dateEN: "Thursday, Oct 1", dateDE: "Do., 1.10", time: "20:45", status: "UPCOMING", team1EN: "Malta", team1DE: "Malta", team2EN: "Gibraltar", team2DE: "Gibraltar" },
            { id: 44, dateKey: "1.10", dateEN: "Thursday, Oct 1", dateDE: "Do., 1.10", time: "20:45", status: "UPCOMING", team1EN: "Denmark", team1DE: "Dänemark", team2EN: "Portugal", team2DE: "Portugal" },

            { id: 50, dateKey: "2.10", dateEN: "Friday, Oct 2", dateDE: "Fr., 2.10", time: "20:45", status: "UPCOMING", team1EN: "Belgium", team1DE: "Belgien", team2EN: "Turkey", team2DE: "Türkei" },
            { id: 51, dateKey: "2.10", dateEN: "Friday, Oct 2", dateDE: "Fr., 2.10", time: "20:45", status: "UPCOMING", team1EN: "Hungary", team1DE: "Ungarn", team2EN: "Georgia", team2DE: "Georgien" },
            { id: 52, dateKey: "2.10", dateEN: "Friday, Oct 2", dateDE: "Fr., 2.10", time: "20:45", status: "UPCOMING", team1EN: "Bosnia-Herzegovina", team1DE: "Bosnien-Herzegowina", team2EN: "Sweden", team2DE: "Schweden" },

            { id: 54, dateKey: "2.10", dateEN: "Friday, Oct 2", dateDE: "Fr., 2.10", time: "20:45", status: "UPCOMING", team1EN: "Ukraine", team1DE: "Ukraine", team2EN: "Northern Ireland", team2DE: "Nordirland" },

            // --- Screenshot 6 & 7: Saturday, 3.10 (Sa., 3.10) ---

            { id: 56, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "18:00", status: "UPCOMING", team1EN: "Iceland", team1DE: "Island", team2EN: "Bulgaria", team2DE: "Bulgarien" },
            { id: 57, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "18:00", status: "UPCOMING", team1EN: "Belarus", team1DE: "Weißrussland", team2EN: "San Marino", team2DE: "San Marino" },
            { id: 58, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "18:00", status: "UPCOMING", team1EN: "Croatia", team1DE: "Kroatien", team2EN: "England", team2DE: "England" },
            { id: 59, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "18:00", status: "UPCOMING", team1EN: "Estonia", team1DE: "Estland", team2EN: "Luxembourg", team2DE: "Luxemburg" },
            { id: 60, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "20:45", status: "UPCOMING", team1EN: "Switzerland", team1DE: "Schweiz", team2EN: "Slovenia", team2DE: "Slowenien" },
            { id: 61, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "20:45", status: "UPCOMING", team1EN: "North Macedonia", team1DE: "Nordmazedonien", team2EN: "Scotland", team2DE: "Schottland" },
            { id: 62, dateKey: "3.10", dateEN: "Saturday, Oct 3", dateDE: "Sa., 3.10", time: "20:45", status: "UPCOMING", team1EN: "Spain", team1DE: "Spanien", team2EN: "Czechia", team2DE: "Tschechien" }
        ];

        // State Management
        let currentLang = localStorage.getItem('unl_lang') || 'DE';
        let currentFilter = 'all';
        let currentDateKey = 'all';
        let userBets = JSON.parse(localStorage.getItem('unl_user_bets')) || {};
        let lockedBets = JSON.parse(localStorage.getItem('unl_locked_bets')) || {};

        // Translation Dictionary
        const i18n = {
            EN: {
                subtitle: "Matchday Predictor & Live Results",
                scoreLabel: "Points:",
                statMatches: "Total Matches",
                statCompleted: "Completed",
                statBets: "Active Predictions",
                statAccuracy: "Accuracy",
                tabAll: "All Fixtures",
                tabFinished: "Finished (Endstand)",
                tabUpcoming: "Upcoming (Termine)",
                lockBtn: "Lock Predictions",
                resetBtn: "Reset",
                allDates: "All Dates",
                endstand: "Endstand",
                today: "Today",
                pickPrompt: "Pick Result",
                correctBet: "Correct Pick! (+3 pts)",
                wrongBet: "Incorrect Pick",
                locked: "Locked",
                lockSingle: "Lock",
                footerText: "UEFA Nations League Dashboard • Data synchronized from official fixture lists",
                draw: "Draw (X)",
                win: "Win"
            },
            DE: {
                subtitle: "Spieltag-Tipper & Live-Ergebnisse",
                scoreLabel: "Punkte:",
                statMatches: "Spiele Gesamt",
                statCompleted: "Beendet",
                statBets: "Aktive Tipps",
                statAccuracy: "Trefferquote",
                tabAll: "Alle Spiele",
                tabFinished: "Endstand (Beendet)",
                tabUpcoming: "Termine (Anstehend)",
                lockBtn: "Tipps Sperren",
                resetBtn: "Zurücksetzen",
                allDates: "Alle Termine",
                endstand: "Endstand",
                today: "Heute",
                pickPrompt: "Tipp Abgeben",
                correctBet: "Richtig getippt! (+3 Pkt)",
                wrongBet: "Falscher Tipp",
                locked: "Gesperrt",
                lockSingle: "Sperren",
                footerText: "UEFA Nations League Dashboard • Daten aus offiziellen Spielplänen synchronisiert",
                draw: "Unentschieden (X)",
                win: "Sieg"
            }
        };

        window.onload = function() {
            updateLanguageUI();
            renderDatePills();
            renderMatches();
            calculateStats();
        };

        function toggleLanguage() {
            currentLang = currentLang === 'EN' ? 'DE' : 'EN';
            localStorage.setItem('unl_lang', currentLang);
            updateLanguageUI();
            renderDatePills();
            renderMatches();
        }

        function updateLanguageUI() {
            const t = i18n[currentLang];
            document.getElementById('lang-indicator').innerText = currentLang;
            document.getElementById('sub-title').innerText = t.subtitle;
            document.getElementById('score-label').innerText = t.scoreLabel;
            document.getElementById('stat-matches-lbl').innerText = t.statMatches;
            document.getElementById('stat-completed-lbl').innerText = t.statCompleted;
            document.getElementById('stat-bets-lbl').innerText = t.statBets;
            document.getElementById('stat-accuracy-lbl').innerText = t.statAccuracy;
            document.getElementById('txt-tab-all').innerText = t.tabAll;
            document.getElementById('txt-tab-finished').innerText = t.tabFinished;
            document.getElementById('txt-tab-upcoming').innerText = t.tabUpcoming;
            document.getElementById('txt-lock-btn').innerText = t.lockBtn;
            document.getElementById('txt-reset-btn').innerText = t.resetBtn;
            document.getElementById('footer-text').innerText = t.footerText;
        }

        function getFlagUrl(teamName) {
            const code = countryFlags[teamName] || 'un';
            return `https://flagcdn.com/w80/${code}.png`;
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'finished', 'upcoming'].forEach(f => {
                const btn = document.getElementById(`tab-${f}`);
                if (f === filter) {
                    btn.className = "px-4 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap bg-blue-600 text-white shadow";
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition whitespace-nowrap";
                }
            });
            renderMatches();
        }

        function setDateKeyFilter(dateKey) {
            currentDateKey = dateKey;
            renderDatePills();
            renderMatches();
        }

        function renderDatePills() {
            const datePillsContainer = document.getElementById('date-pills');
            const dates = [
                { key: 'all', labelEN: 'All Dates', labelDE: 'Alle Termine' },
                { key: 'heute', labelEN: 'Finished (Endstand)', labelDE: 'Heute (Endstand)' },
                { key: 'morgen', labelEN: 'Sunday (Tomorrow)', labelDE: 'Morgen (So.)' },
                { key: '28.9', labelEN: 'Mo., 28.9', labelDE: 'Mo., 28.9' },
                { key: '29.9', labelEN: 'Di., 29.9', labelDE: 'Di., 29.9' },
                { key: '1.10', labelEN: 'Do., 1.10', labelDE: 'Do., 1.10' },
                { key: '2.10', labelEN: 'Fr., 2.10', labelDE: 'Fr., 2.10' },
                { key: '3.10', labelEN: 'Sa., 3.10', labelDE: 'Sa., 3.10' }
            ];

            datePillsContainer.innerHTML = dates.map(d => {
                const isSelected = currentDateKey === d.key;
                const label = currentLang === 'EN' ? d.labelEN : d.labelDE;
                const activeClass = isSelected
                    ? "bg-blue-500/20 text-blue-400 border-blue-500/50"
                    : "bg-gray-800/60 text-gray-400 border-gray-700/50 hover:bg-gray-800 hover:text-gray-200";
                return `<button onclick="setDateKeyFilter('${d.key}')" class="px-3 py-1.5 rounded-xl border text-xs font-medium transition whitespace-nowrap ${activeClass}">
                    ${label}
                </button>`;
            }).join('');
        }

        function renderMatches() {
            const grid = document.getElementById('matches-grid');
            const t = i18n[currentLang];

            const filtered = matchesData.filter(m => {
                if (currentFilter === 'finished' && m.status !== 'FINISHED') return false;
                if (currentFilter === 'upcoming' && m.status !== 'UPCOMING') return false;
                if (currentDateKey !== 'all' && m.dateKey !== currentDateKey) return false;
                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-1 lg:col-span-2 py-12 text-center text-gray-500">
                        <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                        <p class="text-sm font-medium">No matches found for the selected filter.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(m => {
                const team1Name = currentLang === 'EN' ? m.team1EN : m.team1DE;
                const team2Name = currentLang === 'EN' ? m.team2EN : m.team2DE;
                const dateLabel = currentLang === 'EN' ? m.dateEN : m.dateDE;

                const userPick = userBets[m.id];
                const isLocked = lockedBets[m.id];

                // Winner determination for finished matches
                let actualOutcome = null;
                if (m.status === 'FINISHED') {
                    if (m.score1 > m.score2) actualOutcome = '1';
                    else if (m.score2 > m.score1) actualOutcome = '2';
                    else actualOutcome = 'X';
                }

                // Score status indicators
                let betBadge = '';
                if (userPick) {
                    if (m.status === 'FINISHED') {
                        if (userPick === actualOutcome) {
                            betBadge = `<span class="inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"><i class="fa-solid fa-check mr-1"></i>${t.correctBet}</span>`;
                        } else {
                            betBadge = `<span class="inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-500/20 text-red-400 border border-red-500/30"><i class="fa-solid fa-xmark mr-1"></i>${t.wrongBet}</span>`;
                        }
                    } else if (isLocked) {
                        betBadge = `<span class="inline-flex items-center text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30"><i class="fa-solid fa-lock mr-1"></i>${t.locked}</span>`;
                    }
                }

                return `
                <div class="match-card rounded-2xl p-4 flex flex-col justify-between relative overflow-hidden shadow-lg">
                    <!-- Top Status Bar -->
                    <div class="flex items-center justify-between border-b border-gray-800 pb-2 mb-3 text-xs">
                        <span class="text-gray-400 font-medium flex items-center gap-1.5">
                            <i class="fa-regular fa-calendar text-gray-500"></i> ${dateLabel}
                        </span>
                        <div class="flex items-center space-x-2">
                            ${betBadge}
                            <span class="px-2 py-0.5 rounded-full font-semibold ${m.status === 'FINISHED' ? 'bg-gray-800 text-gray-300 border border-gray-700' : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'}">
                                ${m.status === 'FINISHED' ? (currentLang === 'EN' ? 'Endstand' : 'Endstand') : m.time}
                            </span>
                        </div>
                    </div>

                    <!-- Teams & Scores -->
                    <div class="grid grid-cols-12 items-center gap-2 py-1">
                        <!-- Team 1 -->
                        <div class="col-span-5 flex items-center space-x-2.5">
                            <img src="${getFlagUrl(m.team1EN)}" alt="${team1Name}" class="w-7 h-5 object-cover rounded shadow-sm flex-shrink-0" onerror="this.src='https://placehold.co/80x50/333/fff?text=FLAG'">
                            <span class="font-bold text-sm text-gray-100 truncate ${m.status === 'FINISHED' && m.score1 > m.score2 ? 'text-white font-extrabold' : ''}">${team1Name}</span>
                            ${m.redCardTeam1 ? '<span class="inline-block w-2.5 h-3.5 bg-red-600 rounded-sm shadow-md animate-pulse" title="Red Card"></span>' : ''}
                        </div>

                        <!-- Score / vs Display -->
                        <div class="col-span-2 text-center">
                            ${m.status === 'FINISHED' ? `
                                <div class="flex items-center justify-center space-x-1 font-mono font-extrabold text-lg">
                                    <span class="${m.score1 > m.score2 ? 'text-emerald-400' : 'text-gray-200'}">${m.score1}</span>
                                    <span class="text-gray-600">-</span>
                                    <span class="${m.score2 > m.score1 ? 'text-emerald-400' : 'text-gray-200'}">${m.score2}</span>
                                </div>
                            ` : `
                                <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">VS</span>
                            `}
                        </div>

                        <!-- Team 2 -->
                        <div class="col-span-5 flex items-center justify-end space-x-2.5">
                            ${m.redCardTeam2 ? '<span class="inline-block w-2.5 h-3.5 bg-red-600 rounded-sm shadow-md animate-pulse" title="Red Card"></span>' : ''}
                            <span class="font-bold text-sm text-gray-100 truncate text-right ${m.status === 'FINISHED' && m.score2 > m.score1 ? 'text-white font-extrabold' : ''}">${team2Name}</span>
                            <img src="${getFlagUrl(m.team2EN)}" alt="${team2Name}" class="w-7 h-5 object-cover rounded shadow-sm flex-shrink-0" onerror="this.src='https://placehold.co/80x50/333/fff?text=FLAG'">
                        </div>
                    </div>

                    <!-- Prediction Selector Controls -->
                    <div class="mt-4 pt-3 border-t border-gray-800/80 flex items-center justify-between gap-2">
                        <div class="flex items-center space-x-1.5 w-full">
                            <button onclick="makeBet(${m.id}, '1')" ${isLocked ? 'disabled' : ''} class="flex-1 py-1.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center ${userPick === '1' ? 'bg-blue-600 text-white ring-2 ring-blue-400 shadow-md' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-700'} ${isLocked ? 'opacity-60 cursor-not-allowed' : ''}">
                                <span>1</span>
                            </button>

                            <button onclick="makeBet(${m.id}, 'X')" ${isLocked ? 'disabled' : ''} class="flex-1 py-1.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center ${userPick === 'X' ? 'bg-blue-600 text-white ring-2 ring-blue-400 shadow-md' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-700'} ${isLocked ? 'opacity-60 cursor-not-allowed' : ''}">
                                <span>X</span>
                            </button>

                            <button onclick="makeBet(${m.id}, '2')" ${isLocked ? 'disabled' : ''} class="flex-1 py-1.5 px-2 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center ${userPick === '2' ? 'bg-blue-600 text-white ring-2 ring-blue-400 shadow-md' : 'bg-gray-800/80 text-gray-300 hover:bg-gray-700'} ${isLocked ? 'opacity-60 cursor-not-allowed' : ''}">
                                <span>2</span>
                            </button>
                        </div>

                        <button onclick="toggleLockSingle(${m.id})" title="${isLocked ? 'Unlock' : t.lockSingle}" class="p-2 rounded-xl text-xs font-semibold transition ${isLocked ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-gray-800 text-gray-400 hover:text-white'}">
                            <i class="fa-solid ${isLocked ? 'fa-lock' : 'fa-lock-open'}"></i>
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function makeBet(matchId, outcome) {
            if (lockedBets[matchId]) return;
            userBets[matchId] = outcome;
            localStorage.setItem('unl_user_bets', JSON.stringify(userBets));
            renderMatches();
            calculateStats();
        }

        function toggleLockSingle(matchId) {
            lockedBets[matchId] = !lockedBets[matchId];
            localStorage.setItem('unl_locked_bets', JSON.stringify(lockedBets));
            renderMatches();
            calculateStats();
        }

        function lockAllBets() {
            Object.keys(userBets).forEach(id => {
                lockedBets[id] = true;
            });
            localStorage.setItem('unl_locked_bets', JSON.stringify(lockedBets));
            renderMatches();
            calculateStats();
        }

        function resetPredictions() {
            userBets = {};
            lockedBets = {};
            localStorage.removeItem('unl_user_bets');
            localStorage.removeItem('unl_locked_bets');
            renderMatches();
            calculateStats();
        }

        function calculateStats() {
            let points = 0;
            let correctCount = 0;
            let totalEvaluated = 0;

            const activeBetsCount = Object.keys(userBets).length;

            matchesData.forEach(m => {
                const userPick = userBets[m.id];
                if (m.status === 'FINISHED' && userPick) {
                    totalEvaluated++;
                    let actualOutcome = null;
                    if (m.score1 > m.score2) actualOutcome = '1';
                    else if (m.score2 > m.score1) actualOutcome = '2';
                    else actualOutcome = 'X';

                    if (userPick === actualOutcome) {
                        points += 3;
                        correctCount++;
                    }
                }
            });

            const accuracy = totalEvaluated > 0 ? Math.round((correctCount / totalEvaluated) * 100) : 0;

            document.getElementById('user-points').innerText = points;
            document.getElementById('active-bets-count').innerText = activeBetsCount;
            document.getElementById('prediction-accuracy').innerText = `${accuracy}%`;
            document.getElementById('total-matches-count').innerText = matchesData.length;
            document.getElementById('completed-matches-count').innerText = matchesData.filter(m => m.status === 'FINISHED').length;
        }
    </script>
</body>
</html>
